<svg width="480" height="280" viewBox="0 0 480 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sandbox boundary -->
  <rect x="175" y="55" width="160" height="170" rx="8" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="255" y="46" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">sandbox</text>

  <!-- Task box inside sandbox -->
  <rect x="215" y="110" width="80" height="60" rx="5" fill="#FBBF24"/>
  <!-- Play glyph (run task) -->
  <path d="M247 128 L267 140 L247 152 Z" fill="white"/>

  <!-- Declared inputs label -->
  <text x="80" y="60" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">declared inputs</text>

  <!-- Declared input 1 -->
  <rect x="40" y="70" width="80" height="36" rx="5" fill="#9CA3AF"/>
  <path d="M128 88 L165 88" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M159 82 L169 88 L159 94" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Declared input 2 -->
  <rect x="40" y="122" width="80" height="36" rx="5" fill="#9CA3AF"/>
  <path d="M128 140 L165 140" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M159 134 L169 140 L159 146" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Undeclared input, blocked at the boundary -->
  <rect x="40" y="174" width="80" height="36" rx="5" fill="#FF6D74"/>
  <path d="M128 192 L156 192" stroke="#FF6D74" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="167" y1="185" x2="181" y2="199" stroke="#FF6D74" stroke-width="3" stroke-linecap="round"/>
  <line x1="181" y1="185" x2="167" y2="199" stroke="#FF6D74" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="226" text-anchor="middle" fill="#FF6D74" font-family="system-ui, sans-serif" font-size="11">undeclared</text>

  <!-- Declared output -->
  <text x="425" y="114" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">outputs</text>
  <path d="M341 140 L378 140" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M372 134 L382 140 L372 146" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="385" y="122" width="80" height="36" rx="5" fill="#34D399"/>
  <!-- Checkmark -->
  <path d="M412 140 L421 149 L438 130" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
